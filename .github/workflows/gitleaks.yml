name: Gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Revisión semanal del historial completo (lunes 08:00 UTC).
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar secretos con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
