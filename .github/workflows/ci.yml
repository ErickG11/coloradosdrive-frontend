name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  # Valores de prueba: el build de Next.js necesita estas NEXT_PUBLIC_*
  # presentes (ver lib/utils/env.ts), pero no son secretos reales.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_API_URL: http://localhost:3000

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
